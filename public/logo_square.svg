<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .gold-text { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #C9A24B; }
    </style>
  </defs>
  <rect width="512" height="512" fill="#14110D" rx="28"/>
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#C9A24B" stroke-width="1.5" rx="20"/>

  <!-- Scissors Symbol -->
  <g transform="translate(106, 50) scale(2.5)">
    <g stroke="#C9A24B" stroke-linecap="round" fill="none">
      <line x1="72" y1="6" x2="50" y2="84" stroke-width="6"/>
      <line x1="48" y1="6" x2="70" y2="84" stroke-width="6"/>
      <circle cx="41" cy="98" r="13" stroke-width="4.5"/>
      <circle cx="79" cy="98" r="13" stroke-width="4.5"/>
    </g>
    <circle cx="60" cy="49" r="4" fill="#14110D" stroke="#C9A24B" stroke-width="2"/>
  </g>

  <!-- Brand Name -->
  <text x="256" y="445" text-anchor="middle" class="gold-text" font-size="34" letter-spacing="7">GOLD MAKAS</text>
</svg>
